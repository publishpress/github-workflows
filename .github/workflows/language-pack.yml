name: Publish language packs

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      text_domain:
        description: Text domain used in languages/{text-domain}-{locale}.po, .mo, and .json
        required: true
        type: string
    secrets:
      PACKAGE_SERVER_BASE_URL:
        required: false
      PACKAGE_SERVER_SYNC_TOKEN:
        required: false

jobs:
  publish:
    name: Zip committed catalogs and publish the release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the plugin release
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Publish one locales archive
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TEXT_DOMAIN: ${{ inputs.text_domain }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          domain="$TEXT_DOMAIN"
          tag="${RELEASE_TAG:-}"
          repo="${REPO_NAME:-}"
          if [[ ! "$domain" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Text domain is invalid." >&2
            exit 1
          fi
          if [ -z "$tag" ] || [ -z "$repo" ]; then
            echo "Language packs attach to the plugin release. No release tag was provided." >&2
            exit 1
          fi
          gh release view "$tag" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Language packs require a published stable release") else empty end'
          failed=0

            zipfile="${domain}-locales.zip"
            files=()
            for mo in languages/${domain}-*.mo; do
              locale="${mo#languages/${domain}-}"
              locale="${locale%.mo}"
              po="languages/${domain}-${locale}.po"
              json="languages/${domain}-${locale}.json"
              if [[ ! "$locale" =~ ^[A-Za-z0-9_]+$ ]]; then
                echo "Skipping unrecognized locale file ${mo}."
                failed=1
                continue
              fi
              if [ ! -s "$po" ] || [ ! -s "$json" ]; then
                echo "Locale ${locale} is missing its po or json. It is left out of the archive."
                failed=1
                continue
              fi
              if ! grep -a -o -m 1 -E 'PO-Revision-Date: [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}[+-][0-9]{4}' "$mo" >/dev/null; then
                echo "PO-Revision-Date is missing from ${mo}. It is left out of the archive."
                failed=1
                continue
              fi
              files+=("$po" "$mo" "$json")
            done

            if [ "${#files[@]}" -eq 0 ]; then
              echo "No locale pack was published."
              exit 1
            fi
            if ! zip -j "$zipfile" "${files[@]}"; then
              echo "Zip failed. The last published packs stay in place."
              exit 1
            fi
            if ! gh release upload "$tag" "$zipfile" --clobber; then
              echo "Release upload failed. The last published packs stay in place."
              exit 1
            fi
            echo "Attached ${zipfile} to ${tag}."
            echo "digest=$(sha256sum "$zipfile" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

            echo "The release edit below notifies the Package Server GitHub App."
            exit "$failed"

      - name: Notify the GitHub App after attaching catalogs
        if: ${{ !cancelled() && steps.publish.outputs.digest != '' }}
        uses: publishpress/github-workflows/.github/actions/notify-language-packs@7237c0f0abaebf44872caa633c15ffc3ff13e2b4 # v3
        with:
          digest: ${{ steps.publish.outputs.digest }}
          text-domain: ${{ inputs.text_domain }}
          release-tag: ${{ github.event.release.tag_name }}
