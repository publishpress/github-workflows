name: Publish language packs

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      text_domain:
        description: Text domain used in languages/{text-domain}-{locale}.po, .mo, and .json
        required: true
        type: string
    secrets:
      PACKAGE_SERVER_BASE_URL:
        required: false
      PACKAGE_SERVER_SYNC_TOKEN:
        required: false

jobs:
  publish:
    name: Zip committed catalogs and publish the release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the plugin release
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Publish one locales archive
        env:
          GH_TOKEN: ${{ github.token }}
          TEXT_DOMAIN: ${{ inputs.text_domain }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO_NAME: ${{ github.event.repository.name }}
          PACKAGE_SERVER_BASE_URL: ${{ secrets.PACKAGE_SERVER_BASE_URL }}
          PACKAGE_SERVER_SYNC_TOKEN: ${{ secrets.PACKAGE_SERVER_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          domain="$TEXT_DOMAIN"
          tag="${RELEASE_TAG:-}"
          repo="${REPO_NAME:-}"
          if [[ ! "$domain" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Text domain is invalid." >&2
            exit 1
          fi
          if [ -z "$tag" ] || [ -z "$repo" ]; then
            echo "Language packs attach to the plugin release. No release tag was provided." >&2
            exit 1
          fi
          failed=0
          sync=0
          if [ -n "${PACKAGE_SERVER_BASE_URL:-}" ] && [ -n "${PACKAGE_SERVER_SYNC_TOKEN:-}" ]; then
            sync=1
          fi

            zipfile="${domain}-locales.zip"
            files=()
            for mo in languages/${domain}-*.mo; do
              locale="${mo#languages/${domain}-}"
              locale="${locale%.mo}"
              po="languages/${domain}-${locale}.po"
              json="languages/${domain}-${locale}.json"
              if [[ ! "$locale" =~ ^[A-Za-z0-9_]+$ ]]; then
                echo "Skipping unrecognized locale file ${mo}."
                failed=1
                continue
              fi
              if [ ! -f "$po" ] || [ ! -f "$json" ]; then
                echo "Locale ${locale} is missing its po or json. It is left out of the archive."
                failed=1
                continue
              fi
              if ! grep -a -o -m 1 -E 'PO-Revision-Date: [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}[+-][0-9]{4}' "$mo" >/dev/null; then
                echo "PO-Revision-Date is missing from ${mo}. It is left out of the archive."
                failed=1
                continue
              fi
              files+=("$po" "$mo" "$json")
            done

            if [ "${#files[@]}" -eq 0 ]; then
              echo "No locale pack was published."
              exit 1
            fi
            if ! zip -j "$zipfile" "${files[@]}"; then
              echo "Zip failed. The last published packs stay in place."
              exit 1
            fi
            if ! gh release upload "$tag" "$zipfile" --clobber; then
              echo "Release upload failed. The last published packs stay in place."
              exit 1
            fi
            echo "Attached ${zipfile} to ${tag}."

            if [ "$sync" -eq 1 ]; then
              if ! curl --fail-with-body --silent --show-error \
                -X POST \
                -H "Authorization: Bearer ${PACKAGE_SERVER_SYNC_TOKEN}" \
                "${PACKAGE_SERVER_BASE_URL%/}/v1/admin/repository/sync/${repo}/${tag}?force=true"; then
                echo "Package server sync failed for ${tag}. Its last stored packs stay in place."
                exit 1
              fi
            else
              echo "Package server sync secrets are not set. The GitHub release webhook remains the download trigger."
            fi
            exit "$failed"
