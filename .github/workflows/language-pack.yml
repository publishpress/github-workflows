name: Publish language packs

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      text_domain:
        description: Text domain used in languages/{text-domain}-{locale}.po, .mo, and .json
        required: true
        type: string
    secrets:
      PACKAGE_SERVER_BASE_URL:
        required: false
      PACKAGE_SERVER_SYNC_TOKEN:
        required: false

jobs:
  publish:
    name: Zip committed catalogs and publish the release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Publish one release asset per locale
        env:
          GH_TOKEN: ${{ github.token }}
          TEXT_DOMAIN: ${{ inputs.text_domain }}
          PACKAGE_SERVER_BASE_URL: ${{ secrets.PACKAGE_SERVER_BASE_URL }}
          PACKAGE_SERVER_SYNC_TOKEN: ${{ secrets.PACKAGE_SERVER_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          domain="$TEXT_DOMAIN"
          if [[ ! "$domain" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Text domain is invalid." >&2
            exit 1
          fi
          failed=0
          published=0
          sync=0
          if [ -n "${PACKAGE_SERVER_BASE_URL:-}" ] && [ -n "${PACKAGE_SERVER_SYNC_TOKEN:-}" ]; then
            sync=1
          fi

          for mo in languages/${domain}-*.mo; do
            locale="${mo#languages/${domain}-}"
            locale="${locale%.mo}"
            po="languages/${domain}-${locale}.po"
            json="languages/${domain}-${locale}.json"
            if [[ ! "$locale" =~ ^[A-Za-z0-9_]+$ ]]; then
              echo "Skipping unrecognized locale file ${mo}. Its last published pack stays in place."
              failed=1
              continue
            fi
            if [ ! -f "$po" ]; then
              echo "No PO for ${locale}. Its last published pack stays in place."
              failed=1
              continue
            fi
            if [ ! -f "$json" ]; then
              echo "No JSON for ${locale}. Its last published pack stays in place."
              failed=1
              continue
            fi
            updated="$(grep -a -o -m 1 -E 'PO-Revision-Date: [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}[+-][0-9]{4}' "$mo" | sed 's/PO-Revision-Date: //' || true)"
            if [ -z "$updated" ]; then
              echo "PO-Revision-Date is missing from ${mo}. Its last published pack stays in place."
              failed=1
              continue
            fi

            tag="v0.0.0-$(printf '%s' "$locale" | tr '[:upper:]_' '[:lower:]-')"
            zipfile="${domain}-${locale}.zip"
            if ! zip -j "$zipfile" "$po" "$mo" "$json"; then
              echo "Zip failed for ${locale}. Its last published pack stays in place."
              failed=1
              continue
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              if ! gh release upload "$tag" "$zipfile" --clobber; then
                echo "Release upload failed for ${locale}. Its last published pack stays in place."
                failed=1
                continue
              fi
              if ! gh release edit "$tag" --title "$updated" --notes "$updated"; then
                echo "Release notes update failed for ${locale}."
                failed=1
                continue
              fi
            else
              if ! gh release create "$tag" "$zipfile" --title "$updated" --notes "$updated"; then
                echo "Release create failed for ${locale}. Its last published pack stays in place."
                failed=1
                continue
              fi
            fi

            if [ "$sync" -eq 1 ]; then
              if ! curl --fail-with-body --silent --show-error \
                -X POST \
                -H "Authorization: Bearer ${PACKAGE_SERVER_SYNC_TOKEN}" \
                "${PACKAGE_SERVER_BASE_URL%/}/v1/admin/repository/sync/${domain}/${tag}?force=true"; then
                echo "Package server sync failed for ${tag}. Its last stored pack stays in place."
                failed=1
                continue
              fi
            fi

            published=$((published + 1))
            echo "Published ${tag} (${updated})."
          done

          if [ "$sync" -eq 0 ]; then
            echo "Package server sync secrets are not set. The GitHub release webhook remains the download trigger."
          fi
          if [ "$published" -eq 0 ]; then
            echo "No locale pack was published."
            failed=1
          fi
          exit "$failed"
