name: Sign existing releases (one tag or all) without rebuilding
permissions:
  contents: write
on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Exact stable release tag (e.g. v1.2.3), or "all" to sign every eligible unsigned stable release.'
        required: true
        type: string
    secrets:
      PLUGIN_ZIP_ED25519_PRIVATE_KEY:
        required: true
concurrency:
  group: sign-existing-releases-${{ github.repository }}
  cancel-in-progress: false
jobs:
  sign-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Sign original release ZIPs and upload signatures
        uses: publishpress/github-workflows/.github/actions/sign-existing-releases@7237c0f0abaebf44872caa633c15ffc3ff13e2b4 # v3
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          release-tag: ${{ inputs.release_tag }}
          private-key: ${{ secrets.PLUGIN_ZIP_ED25519_PRIVATE_KEY }}
