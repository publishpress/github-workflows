name: Sign existing releases without rebuilding
permissions:
  contents: write
on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact stable release tag, or all to sign unsigned stable releases.
        required: true
        type: string
    secrets:
      PLUGIN_ZIP_ED25519_PRIVATE_KEY:
        required: true
concurrency:
  group: sign-existing-releases-${{ github.repository }}
  cancel-in-progress: false
jobs:
  sign-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Sign original release ZIPs and upload signatures
        uses: publishpress/github-workflows/.github/actions/sign-existing-releases@v3
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          release-tag: ${{ inputs.release_tag }}
          private-key: ${{ secrets.PLUGIN_ZIP_ED25519_PRIVATE_KEY }}
