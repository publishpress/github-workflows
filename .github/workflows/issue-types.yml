name: Classify issue types
permissions:
  contents: read
  issues: write
on:
  workflow_call:
    inputs:
      dry_run:
        description: Log the chosen type without updating the issue
        required: false
        type: boolean
        default: false
      min_confidence:
        description: Minimum JEV confidence (0-1) required before applying a type
        required: false
        type: string
        default: "0.8"
      max_issues:
        description: Maximum untyped open issues to classify in one run
        required: false
        type: string
        default: "50"
    secrets:
      TYPESAFE_API_KEY:
        description: TypeSafe API key. Provide the organization secret with secrets:inherit.
        required: true

jobs:
  classify:
    name: Apply issue types with JEV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Classify open issues that have no type
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          MIN_CONFIDENCE: ${{ inputs.min_confidence }}
          MAX_ISSUES: ${{ inputs.max_issues }}
        # actions/github-script@v8.0.0
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const API_HEADERS = {
              'X-GitHub-Api-Version': '2026-03-10',
            };
            const BODY_LIMIT = 12000;
            const JEV_URL = 'https://api.typesafe.ai/v1/systemone';

            const dryRun = process.env.DRY_RUN === 'true';
            const minConfidence = Number(process.env.MIN_CONFIDENCE);
            const maxIssues = Number(process.env.MAX_ISSUES);
            const apiKey = process.env.TYPESAFE_API_KEY;

            if (!apiKey) {
              core.setFailed('TYPESAFE_API_KEY is empty. Add it as an organization secret and pass it with secrets: inherit.');
              return;
            }

            if (!Number.isFinite(minConfidence) || minConfidence <= 0 || minConfidence > 1) {
              core.setFailed('min_confidence must be a number greater than 0 and at most 1.');
              return;
            }

            if (!Number.isInteger(maxIssues) || maxIssues < 1 || maxIssues > 200) {
              core.setFailed('max_issues must be an integer from 1 to 200.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let issueTypes;

            try {
              issueTypes = await github.paginate('GET /repos/{owner}/{repo}/issue-types', {
                owner,
                repo,
                per_page: 100,
                headers: API_HEADERS,
              });
            } catch (error) {
              if (error.status === 403 || error.status === 404) {
                core.setFailed(
                  'Could not list issue types. Confirm this repository belongs to an organization with issue types enabled and that the workflow token can read issues.'
                );
                return;
              }

              throw error;
            }

            const enabledTypes = issueTypes.filter((issueType) => issueType.is_enabled);
            if (enabledTypes.length === 0) {
              core.setFailed('This organization has no enabled issue types.');
              return;
            }

            const criteria = {};
            const typeNames = new Set();
            for (const issueType of enabledTypes) {
              criteria[issueType.name] = issueType.description || issueType.name;
              typeNames.add(issueType.name);
            }

            const issues = await github.paginate('GET /repos/{owner}/{repo}/issues', {
              owner,
              repo,
              state: 'open',
              per_page: 100,
              headers: API_HEADERS,
            });

            const untyped = issues
              .filter((issue) => !issue.pull_request && !issue.type)
              .sort((left, right) => Date.parse(left.created_at) - Date.parse(right.created_at))
              .slice(0, maxIssues);

            core.info(`Enabled issue types: ${enabledTypes.map((issueType) => issueType.name).join(', ')}.`);
            core.info(`Found ${untyped.length} untyped open issue(s) to classify (limit ${maxIssues}).`);
            core.info(dryRun ? 'Dry run enabled. No issue types will be changed.' : 'Dry run disabled. Matching issues will be updated.');

            const result = {
              applied: 0,
              wouldApply: 0,
              skippedLowConfidence: 0,
              failed: 0,
            };
            const summaryRows = [];

            for (const issue of untyped) {
              const labels = (issue.labels || []).map((label) => label.name).join(', ');
              const body = (issue.body || '').slice(0, BODY_LIMIT);
              const state = [
                `Title: ${issue.title}`,
                `Labels: ${labels || 'none'}`,
                'Body:',
                body || '(empty)',
              ].join('\n');

              let answer;

              try {
                const response = await fetch(JEV_URL, {
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${apiKey}`,
                    'Content-Type': 'application/json',
                    Accept: 'application/json',
                  },
                  body: JSON.stringify({
                    model: 'jev-latest',
                    state,
                    questions: {
                      issue_type: {
                        type: 'choice',
                        instructions: 'Which issue type best classifies this GitHub issue? Choose exactly one type. Use each type description as the rubric.',
                        criteria,
                      },
                    },
                  }),
                });

                const payload = await response.json().catch(() => null);

                if (response.status === 401 || response.status === 403) {
                  core.setFailed('TypeSafe rejected TYPESAFE_API_KEY. Check the organization secret.');
                  return;
                }

                if (!response.ok || !payload?.answers?.issue_type) {
                  result.failed++;
                  const detail = payload?.error || payload?.message || response.statusText;
                  core.warning(`#${issue.number}: JEV request failed (${response.status}: ${detail}).`);
                  summaryRows.push([`#${issue.number}`, '—', '—', 'failed']);
                  continue;
                }

                answer = payload.answers.issue_type;
              } catch (error) {
                result.failed++;
                core.warning(`#${issue.number}: JEV request failed (${error.message}).`);
                summaryRows.push([`#${issue.number}`, '—', '—', 'failed']);
                continue;
              }

              const choice = answer.choice;
              const confidence = Number(answer.confidence);

              if (!typeNames.has(choice) || !Number.isFinite(confidence)) {
                result.failed++;
                core.warning(`#${issue.number}: JEV returned an unusable answer.`);
                summaryRows.push([`#${issue.number}`, String(choice || '—'), '—', 'failed']);
                continue;
              }

              const confidenceLabel = confidence.toFixed(2);

              if (confidence < minConfidence) {
                result.skippedLowConfidence++;
                core.info(`Skipping #${issue.number}: ${choice} at ${confidenceLabel} is below ${minConfidence}.`);
                summaryRows.push([`#${issue.number}`, choice, confidenceLabel, 'skipped']);
                continue;
              }

              if (dryRun) {
                result.wouldApply++;
                core.info(`Would set #${issue.number} to ${choice} (${confidenceLabel}).`);
                summaryRows.push([`#${issue.number}`, choice, confidenceLabel, 'dry run']);
                continue;
              }

              await github.request('PATCH /repos/{owner}/{repo}/issues/{issue_number}', {
                owner,
                repo,
                issue_number: issue.number,
                type: choice,
                headers: API_HEADERS,
              });

              result.applied++;
              core.info(`Set #${issue.number} to ${choice} (${confidenceLabel}).`);
              summaryRows.push([`#${issue.number}`, choice, confidenceLabel, 'applied']);
            }

            await core.summary
              .addHeading('Issue type classification')
              .addTable([
                [{ data: 'Result', header: true }, { data: 'Count', header: true }],
                ['Applied', String(result.applied)],
                ['Dry-run matches', String(result.wouldApply)],
                ['Skipped below confidence', String(result.skippedLowConfidence)],
                ['Failed', String(result.failed)],
              ])
              .addHeading('Issues', 2)
              .addTable([
                [
                  { data: 'Issue', header: true },
                  { data: 'Type', header: true },
                  { data: 'Confidence', header: true },
                  { data: 'Result', header: true },
                ],
                ...(summaryRows.length > 0 ? summaryRows : [['—', '—', '—', 'none']]),
              ])
              .write();

            if (result.failed > 0 && result.applied === 0 && result.wouldApply === 0 && result.skippedLowConfidence === 0) {
              core.setFailed(`${result.failed} issue(s) could not be classified.`);
            }
