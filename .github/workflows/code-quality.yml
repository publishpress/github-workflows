name: Measure code quality
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      ref:
        description: Commit, tag, or branch to measure.
        required: true
        type: string
      entity_slug:
        description: Dashboard entity slug.
        required: true
        type: string
      source:
        description: release or development.
        required: true
        type: string
    secrets:
      INFRA_DASHBOARD_URL:
        required: true
      INFRA_PLUGIN_USER:
        required: true
      INFRA_PLUGIN_PASSWORD:
        required: true
      INFRA_READ_TOKEN:
        required: true
      OPENAI_API_KEY:
        required: true

jobs:
  measure:
    name: Post code quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the audited ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout the code quality action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: publishpress/infra
          ref: development
          token: ${{ secrets.INFRA_READ_TOKEN }}
          path: .code-quality
          sparse-checkout: .github/actions/code-quality
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, tokenizer
          tools: composer:v2
          coverage: none

      - name: Install measurement tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quality-tools" "$RUNNER_TEMP/wpcs"
          composer require --no-interaction --working-dir="$RUNNER_TEMP/quality-tools" \
            phpmetrics/phpmetrics:2.8.2 phpmd/phpmd:2.15.0
          echo "$RUNNER_TEMP/quality-tools/vendor/bin" >> "$GITHUB_PATH"
          if [[ "${{ inputs.entity_slug }}" == wp-plugin* ]]; then
            composer init --no-interaction --name=publishpress/code-quality-wpcs --working-dir="$RUNNER_TEMP/wpcs"
            composer config --no-plugins --working-dir="$RUNNER_TEMP/wpcs" allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
            composer require --no-interaction --working-dir="$RUNNER_TEMP/wpcs" \
              squizlabs/php_codesniffer:^3 wp-coding-standards/wpcs:^3
            echo "$RUNNER_TEMP/wpcs/vendor/bin" >> "$GITHUB_PATH"
          fi

      - name: Measure PHPMetrics
        env:
          ENTITY_SLUG: ${{ inputs.entity_slug }}
          AUDIT_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          GIT_SHA="$sha" bash .code-quality/.github/actions/code-quality/audit.sh measure

      - name: Score with Codex
        uses: openai/codex-action@4aac6da4b686168e147798ca841cf64ff0f027b8
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          prompt-file: .code-quality/.github/actions/code-quality/prompt.md
          output-schema-file: .code-quality/.github/actions/code-quality/scores.schema.json
          output-file: ${{ runner.temp }}/code-quality-scores.json

      - name: Post code quality
        env:
          DASHBOARD_URL: ${{ secrets.INFRA_DASHBOARD_URL }}
          ENTITY_SLUG: ${{ inputs.entity_slug }}
          USERNAME: ${{ secrets.INFRA_PLUGIN_USER }}
          APP_PASSWORD: ${{ secrets.INFRA_PLUGIN_PASSWORD }}
          AUDIT_SOURCE: ${{ inputs.source }}
          SCORES_JSON: ${{ runner.temp }}/code-quality-scores.json
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          GIT_SHA="$sha" bash .code-quality/.github/actions/code-quality/audit.sh post
