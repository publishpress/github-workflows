name: Build and publish pro plugin
permissions:
  contents: write
on:
  workflow_call:
    inputs:
      sign_package:
        description: Sign the release ZIP with the configured Ed25519 private key.
        required: false
        type: boolean
        default: false
      package_signing_key_id:
        description: Public key identifier written to the detached signature asset.
        required: false
        type: string
        default: ''
    secrets:
      PACKAGE_SIGNING_PRIVATE_KEY:
        required: false

env:
  DEV_SCRIPTS_DIR: ${{ github.workspace }}/vendor/publishpress/dev-workspace/scripts

jobs:
  deploy-pro:
    name: Build and attach the tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up PHP
        # shivammathur/setup-php@2.37.0
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f
        with:
          php-version: 8.3
          extensions: mbstring,xml,curl,zip,intl,bcmath,gettext,mysqli,phar,gd,iconv,yaml
          tools: composer:v2

      - name: Create root .env file
        run: cp $GITHUB_WORKSPACE/.env.example $GITHUB_WORKSPACE/.env

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Show dev-workspace tool versions
        run: composer info:version

      - name: Add dev-workspace scripts to PATH
        run: echo "$DEV_SCRIPTS_DIR" >> "$GITHUB_PATH"

      - name: Build plugin package
        run: composer build

      - name: Read plugin metadata and version
        id: get-metadata
        run: composer deploy:metadata-github-output

      - name: Resolve package path
        id: package
        env:
          PLUGIN_NAME: ${{ steps.get-metadata.outputs.plugin-name }}
          PLUGIN_VERSION: ${{ steps.get-metadata.outputs.plugin-version }}
        run: |
          package="$GITHUB_WORKSPACE/dist/${PLUGIN_NAME}-${PLUGIN_VERSION}.zip"
          if [ ! -s "$package" ]; then
            echo "::error::Built package not found or empty: $package"
            exit 1
          fi
          echo "path=$package" >> "$GITHUB_OUTPUT"

      - name: Sign package
        if: inputs.sign_package
        id: signature
        env:
          PRIVATE_KEY: ${{ secrets.PACKAGE_SIGNING_PRIVATE_KEY }}
          KEY_ID: ${{ inputs.package_signing_key_id }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          if [ -z "$PRIVATE_KEY" ] || [ -z "$KEY_ID" ]; then
            echo "::error::Package signing requires PACKAGE_SIGNING_PRIVATE_KEY and package_signing_key_id."
            exit 1
          fi

          key_file="$RUNNER_TEMP/package-signing-key.pem"
          signature_file="${PACKAGE_PATH}.sig.bin"
          signature_asset="${PACKAGE_PATH}.sig"
          printf '%s' "$PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          trap 'rm -f "$key_file" "$signature_file"' EXIT

          openssl pkeyutl -sign -rawin -inkey "$key_file" -in "$PACKAGE_PATH" -out "$signature_file"
          signature="$(base64 -w 0 "$signature_file")"
          jq -n \
            --arg keyId "$KEY_ID" \
            --arg signature "$signature" \
            '{version: 1, algorithm: "Ed25519", keyId: $keyId, signature: $signature}' \
            > "$signature_asset"
          echo "path=$signature_asset" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned GitHub release asset
        if: ${{ !inputs.sign_package }}
        # softprops/action-gh-release@v3.0.0
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: ${{ steps.package.outputs.path }}

      - name: Upload signed GitHub release assets
        if: inputs.sign_package
        # softprops/action-gh-release@v3.0.0
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: |
            ${{ steps.package.outputs.path }}
            ${{ steps.signature.outputs.path }}
