name: Build and publish pro plugin
permissions:
  contents: write
on:
  workflow_call:
    inputs:
      sign_package:
        description: Sign the release ZIP with the configured Ed25519 private key.
        required: false
        type: boolean
        default: true
      package_signing_key_id:
        description: Public key identifier written to the detached signature asset.
        required: false
        type: string
        default: ''
    secrets:
      PLUGIN_ZIP_ED25519_PRIVATE_KEY:
        required: true

env:
  DEV_SCRIPTS_DIR: ${{ github.workspace }}/vendor/publishpress/dev-workspace/scripts

jobs:
  deploy-pro:
    if: github.event_name != 'release' || (github.event.release.draft == false && github.event.release.prerelease == false)
    name: Build and attach the tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require signed stable release
        env:
          SIGN_PACKAGE: ${{ inputs.sign_package }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if [[ "$SIGN_PACKAGE" != true || ! "$RELEASE_TAG" =~ ^v?-?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Stable release builds must be signed and use a stable version tag.'
            exit 1
          fi
      - name: Checkout repository
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up PHP
        # shivammathur/setup-php@2.37.0
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f
        with:
          php-version: 8.3
          extensions: mbstring,xml,curl,zip,intl,bcmath,gettext,mysqli,phar,gd,iconv,yaml
          tools: composer:v2

      - name: Create root .env file
        run: cp $GITHUB_WORKSPACE/.env.example $GITHUB_WORKSPACE/.env

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Show dev-workspace tool versions
        run: composer info:version

      - name: Add dev-workspace scripts to PATH
        run: echo "$DEV_SCRIPTS_DIR" >> "$GITHUB_PATH"

      - name: Build plugin package
        run: composer build

      - name: Read plugin metadata and version
        id: get-metadata
        run: composer deploy:metadata-github-output

      - name: Resolve package path
        id: package
        env:
          PLUGIN_NAME: ${{ steps.get-metadata.outputs.plugin-name }}
          PLUGIN_VERSION: ${{ steps.get-metadata.outputs.plugin-version }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          version="${version#-}"
          if [[ "$PLUGIN_VERSION" != "$version" ]]; then
            echo '::error::The built plugin version must match the release tag.'
            exit 1
          fi
          package="$GITHUB_WORKSPACE/dist/${PLUGIN_NAME}-${PLUGIN_VERSION}.zip"
          if [ ! -s "$package" ]; then
            echo "::error::Built package not found or empty: $package"
            exit 1
          fi
          echo "path=$package" >> "$GITHUB_OUTPUT"

      - name: Sign package
        id: signature
        uses: publishpress/github-workflows/.github/actions/sign-package@v3
        with:
          private-key: ${{ secrets.PLUGIN_ZIP_ED25519_PRIVATE_KEY }}
          key-id: ${{ inputs.package_signing_key_id }}
          package-path: ${{ steps.package.outputs.path }}

      - name: Upload signed GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          SIGNATURE_PATH: ${{ steps.signature.outputs.path }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$PACKAGE_PATH" "$SIGNATURE_PATH" --repo "$GITHUB_REPOSITORY" --clobber
