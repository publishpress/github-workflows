name: Deploy free plugin to WordPress.org
permissions:
  contents: write
on:
  workflow_call:
    inputs:
      stable_branch:
        description: Branch that a stable release tag commit must be contained in
        required: false
        type: string
        default: master
    secrets:
      PLUGIN_ZIP_ED25519_PRIVATE_KEY:
        required: true
      SVN_USERNAME:
        required: true
      SVN_PASSWORD:
        required: true

env:
  DEV_SCRIPTS_DIR: ${{ github.workspace }}/vendor/publishpress/dev-workspace/scripts

jobs:
  deploy-wp-org:
    if: github.event_name != 'release' || (github.event.release.draft == false && github.event.release.prerelease == false)
    name: Deploy the tagged release to WordPress.org
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up PHP
        # shivammathur/setup-php@2.37.0
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f
        with:
          php-version: 8.3
          extensions: mbstring,xml,curl,zip,intl,bcmath,gettext,mysqli,phar,gd,iconv,yaml
          tools: composer:v2

      - name: Create root .env file
        run: cp $GITHUB_WORKSPACE/.env.example $GITHUB_WORKSPACE/.env

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Show dev-workspace tool versions
        run: composer info:version

      - name: Add dev-workspace scripts to PATH
        run: echo "$DEV_SCRIPTS_DIR" >> "$GITHUB_PATH"

      - name: Build plugin package
        run: composer build

      - name: Read plugin metadata and version
        id: get-metadata
        run: composer deploy:metadata-github-output

      - name: Checkout release validation helper
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: publishpress/github-workflows
          ref: v3
          path: .pp-github-workflows
          persist-credentials: false
          sparse-checkout: |
            .github/actions/validate-free-release
          sparse-checkout-cone-mode: false

      - name: Validate release tag, branch, and built version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          STABLE_BRANCH: ${{ inputs.stable_branch }}
          BUILT_VERSION: ${{ steps.get-metadata.outputs.plugin-version }}
          REPO_ROOT: ${{ github.workspace }}
        run: bash "${{ github.workspace }}/.pp-github-workflows/.github/actions/validate-free-release/validate.sh"

      - name: Sign package
        id: signature
        uses: publishpress/github-workflows/.github/actions/sign-package@v3
        with:
          private-key: ${{ secrets.PLUGIN_ZIP_ED25519_PRIVATE_KEY }}
          package-path: ${{ github.workspace }}/dist/${{ steps.get-metadata.outputs.plugin-name }}-${{ steps.get-metadata.outputs.plugin-version }}.zip

      - name: Upload signed GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          PACKAGE_PATH: ${{ github.workspace }}/dist/${{ steps.get-metadata.outputs.plugin-name }}-${{ steps.get-metadata.outputs.plugin-version }}.zip
          SIGNATURE_PATH: ${{ steps.signature.outputs.path }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$PACKAGE_PATH" "$SIGNATURE_PATH" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Deploy plugin to WordPress.org
        # 10up/action-wordpress-plugin-deploy@v2.3.0
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: ${{ steps.get-metadata.outputs.plugin-folder }}
          BUILD_DIR: ${{ github.workspace }}/dist/${{ steps.get-metadata.outputs.plugin-folder }}
